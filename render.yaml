# render.yaml - Render Blueprint Specification (100% Free Tier Compatible)
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: fraudengine-platform
    env: python
    plan: free
    region: oregon
    buildCommand: bash scripts/build_render.sh
    startCommand: bash scripts/start_render.sh
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: NODE_VERSION
        value: 20.12.0
      - key: ALLOW_FULL_PUBLIC_ACCESS
        value: "true"
      - key: DEMO_MODE
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        generateValue: true
